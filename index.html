      throw Error("Different owner: create a new project");
    return validate({
      schema: 1,
      owner,
      profile: { name: profile.name || profile.login, bio: profile.bio || "" },
      repos,
      fetchedAt: now,
      settings: previous?.settings || {},
      edits: previous?.edits || {},
    });
  }
  function cards(p, includeHidden = false) {
    return p.repos
      .map((r) => {
        const e = p.edits[String(r.id)] || {};
        return {
          ...r,
          ...e,
          title: e.title || r.name,
          description: e.description ?? r.description,
          category: e.category || r.language || "Other",
          demo: e.demo ?? r.homepage,
          download: e.download || "",
          image: e.image || "",
          source: "https://github.com/" + r.full_name,
        };
      })
      .filter((r) => includeHidden || !r.hidden);
  }
  function select(
    p,
    {
      search = "",
      category = "",
      sort = "featured",
      includeHidden = false,
    } = {},
  ) {
    const q = search.toLocaleLowerCase().trim();
    return cards(p, includeHidden)
      .filter(
        (r) =>
          (!category || r.category === category) &&
          (!q ||
            [r.title, r.name, r.description, r.category, ...r.topics]
              .join(" ")
              .toLocaleLowerCase()
              .includes(q)),
      )
      .sort((a, b) => {
        let n =
          sort === "name"
            ? a.title.localeCompare(b.title)
            : sort === "updated"
              ? b.updated_at.localeCompare(a.updated_at)
              : sort === "stars"
                ? b.stars - a.stars
                : Number(!!b.featured) - Number(!!a.featured);
        return n || a.title.localeCompare(b.title);
      });
  }
  async function github(owner, fetcher = fetch) {
    if (!USER.test(owner)) throw Error("Invalid GitHub username");
    async function get(path) {
      const response = await fetcher("https://api.github.com" + path, {
        headers: { Accept: "application/vnd.github+json" },
        signal: AbortSignal.timeout(20000),
        credentials: "omit",
        redirect: "error",
      });
      if (!response.ok)
        throw Error(
          response.status === 403 || response.status === 429
            ? "GitHub rate limit. Try again later."
            : `GitHub HTTP ${response.status}`,
        );
      const raw = await response.text();
      if (raw.length > 8000000) throw Error("GitHub response too large");
      return JSON.parse(raw);
    }
    const profile = await get("/users/" + owner);
    let repos = [];
    for (let page = 1; page <= 10; page++) {
      const rows = await get(
        `/users/${owner}/repos?type=owner&per_page=100&page=${page}&sort=full_name`,
      );
      if (!Array.isArray(rows)) throw Error("Invalid GitHub response");
      repos.push(...rows);
      if (rows.length < 100) return { profile, repos };
    }
    throw Error(
      "More than 999 repositories: import cancelled to avoid an incomplete catalogue",
    );
  }
  function esc(s) {
    return String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  }
  function publicProject(p) {
    const out = validate(p);
    out.repos = out.repos.filter((r) => !out.edits[r.id]?.hidden);
    const ids = new Set(out.repos.map((r) => String(r.id)));
    out.edits = Object.fromEntries(
      Object.entries(out.edits).filter(([id]) => ids.has(id)),
    );
    return out;
  }
  return {
    USER,
    url,
    image,
    repo,
    edit,
    validate,
    merge,
    cards,
    select,
    github,
    publicProject,
    esc,
  };
});
